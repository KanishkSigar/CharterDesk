name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - name: Lint PHP
        run: |
          php -v | head -1
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JS syntax
        run: |
          node --version
          for f in assets/js/*.js; do node --check "$f" && echo "ok: $f"; done

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Validate SQL (schema + seed apply cleanly)
        run: |
          mysql -h 127.0.0.1 -uroot -proot < sql/schema.sql
          mysql -h 127.0.0.1 -uroot -proot ime_negotiation < sql/participants.sql
          mysql -h 127.0.0.1 -uroot -proot < sql/seed.sql
          mysql -h 127.0.0.1 -uroot -proot -e "USE ime_negotiation; \
            SELECT COUNT(*) AS threads FROM threads; \
            SELECT COUNT(*) AS offers FROM offers;"

      - name: Smoke-test private negotiation
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: ime_negotiation
        run: |
          php -S 127.0.0.1:8090 >/tmp/charterdesk-php.log 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid"; cat /tmp/charterdesk-php.log' EXIT
          curl --fail --silent --retry 5 --retry-connrefused http://127.0.0.1:8090/dashboard.html >/dev/null
          python3 scripts/check_pilot.py http://127.0.0.1:8090
